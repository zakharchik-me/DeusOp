version: '3.7'

services:
  frontend:
    build:
      context: ./react-frontend
    container_name: frontend
    env_file:
      - ./react-frontend/.env
    networks:
      - app-network
    expose:
      - 3000

  backend:
    build:
      context: ./spring-backend
    container_name: backend
    env_file:
      - .env
    networks:
      - app-network
    expose:
      - 8080
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./react-frontend/build:/usr/share/nginx/html
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
