version: '3.7'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/mysql
    restart: always

  backend:
    build:
      context: ./spring-backend
    container_name: backend
    env_file:
      - .env
    networks:
      - app-network
    expose:
      - 8080
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

  frontend:
    build:
      context: ./react-frontend
    container_name: frontend
    env_file:
      - ./react-frontend/.env
    networks:
      - app-network
    expose:
      - ${FRONTEND_PORT}
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./react-frontend/build:/usr/share/nginx/html
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    networks:
      - app-network
    depends_on:
      - backend
      - frontend

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
